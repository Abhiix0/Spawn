[project]
name = "spawnio"
version = "1.1.1"
description = "Spawn a ready-to-use Python project in seconds"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Abhiix0" }
]
keywords = ["scaffolding", "template", "cli", "project-generator", "uv", "starter-kit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.0.0",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/Abhiix0/spawn"
Repository = "https://github.com/Abhiix0/spawn"
Issues = "https://github.com/Abhiix0/spawn/issues"
Documentation = "https://github.com/Abhiix0/spawn#readme"

 
[project.scripts]
spawn = "spawn.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spawn"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/CONTRIBUTING.md",
]


[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 88

