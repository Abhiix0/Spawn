[project]
name = "spawnio"
version = "1.0.6"
description = "Spawn a ready-to-use Python project in seconds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.0.0",
    "rich>=15.0.0",
    "typer>=0.26.7",
]
 
[project.scripts]
spawn = "spawn.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spawn"]


[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
