name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Smoke-test the built wheel and check version matches tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/smoke.sh "${RELEASE_TAG#v}"

      - name: Publish to PyPI
        run: uv publish
