name: PR Check

# Runs on every PR targeting main.
# ci.yml already runs the plain test + ruff-check pass on both push and PR.
# This workflow adds what ci.yml does not: coverage reporting, format check,
# and automatic PR labeling — so there is no duplicate test run.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Coverage + format check
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with coverage
        run: uv run pytest --cov=src/spawn --cov-report=xml --cov-report=term-missing

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Auto-labeling
  # ---------------------------------------------------------------------------
  label:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
