name: Feature request
description: Suggest a new template, command, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that spawnio doesn't support today?
      placeholder: "I want to scaffold a … project but there's no template for it."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about? Fine to leave blank.
    validations:
      required: false
